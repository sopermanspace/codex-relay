<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay pairing screen</title>
  <desc id="desc">Dark desktop pairing screen with a centered device approval panel and one-time code.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="8%" r="80%">
      <stop offset="0" stop-color="#18352b"/>
      <stop offset=".45" stop-color="#080b0d"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fff" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect x="56" y="44" width="1168" height="732" rx="34" fill="#090b0e" stroke="#ffffff" stroke-opacity=".08"/>
  <g transform="translate(96 84)">
    <circle cx="14" cy="14" r="6" fill="#34d399"/>
    <text x="34" y="20" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Codex Relay</text>
    <text x="34" y="48" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="13">Ready on this Mac</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="382" y="194" width="516" height="432" rx="32" fill="#101216" stroke="#ffffff" stroke-opacity=".11"/>
    <rect x="383" y="195" width="514" height="1" fill="#ffffff" opacity=".18"/>
  </g>
  <circle cx="640" cy="268" r="42" fill="#123327" stroke="#34d399" stroke-opacity=".45"/>
  <path d="M621 268l13 13 28-31" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="348" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle">Nearby device wants to pair</text>
  <text x="640" y="386" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">Pixel phone on your trusted Wi-Fi</text>
  <rect x="494" y="430" width="292" height="82" rx="18" fill="#060708" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="640" y="484" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="6" text-anchor="middle">4817 0932</text>
  <rect x="444" y="544" width="184" height="54" rx="17" fill="#34d399"/>
  <text x="536" y="578" fill="#020617" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Confirm</text>
  <rect x="652" y="544" width="184" height="54" rx="17" fill="#171a20" stroke="#ffffff" stroke-opacity=".09"/>
  <text x="744" y="578" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Cancel</text>
</svg>
