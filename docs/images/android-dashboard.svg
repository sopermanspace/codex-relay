<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay Android dashboard</title>
  <desc id="desc">Native Android dashboard showing project selection, command composer, and Codex output cards.</desc>
  <rect width="720" height="1280" rx="56" fill="#050607"/>
  <rect x="28" y="26" width="664" height="1228" rx="42" fill="#080a0d" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="72" y="100" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">Relay Dashboard</text>
  <text x="72" y="132" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="14">Mobile assistant</text>
  <rect x="72" y="178" width="576" height="104" rx="24" fill="#0e1116" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="120" cy="230" r="22" fill="#123327"/>
  <path d="M110 230l8 8 18-22" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="162" y="222" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Connected to Mac</text>
  <text x="162" y="252" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="14">Secure paired-device token active</text>
  <rect x="72" y="324" width="576" height="170" rx="24" fill="#0e1116" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="104" y="370" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">Projects</text>
  <rect x="104" y="402" width="512" height="58" rx="17" fill="#15281f" stroke="#34d399" stroke-opacity=".32"/>
  <text x="132" y="438" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Mobile assistant</text>
  <rect x="72" y="536" width="576" height="328" rx="24" fill="#0e1116" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="104" y="582" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">Codex output</text>
  <text x="104" y="628" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">1. Server command API is live.</text>
  <text x="104" y="666" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">2. Android chat surface is ready.</text>
  <text x="104" y="704" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">3. Next: test the release build.</text>
  <rect x="104" y="760" width="160" height="48" rx="16" fill="#171a20" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="184" y="791" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="750" text-anchor="middle">Copy</text>
  <rect x="72" y="934" width="576" height="118" rx="28" fill="#0e1116" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="104" y="984" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17">Ask Codex anything...</text>
  <circle cx="596" cy="993" r="31" fill="#34d399"/>
  <path d="M586 993h22M600 982l12 11-12 11" fill="none" stroke="#020617" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
