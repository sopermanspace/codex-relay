name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build native release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        working-directory: android-native
        run: gradle assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-relay-release-unsigned-apk
          path: android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
