name: Capture Android Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Capture APK screens
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-native
        run: gradle assembleDebug

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            mkdir -p screenshots
            dismiss_system_dialog() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/window.xml 2>/dev/null | grep -q "System UI isn"; then
                adb shell input tap 360 1060 || true
                sleep 1
              fi
            }
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell am start -n com.codex.remote/.MainActivity
            sleep 4
            dismiss_system_dialog
            adb exec-out screencap -p > screenshots/codex-relay-connect.png
            adb shell am force-stop com.codex.remote
            adb shell am start -n com.codex.remote/.MainActivity --ez demo_dashboard true
            sleep 4
            dismiss_system_dialog
            adb exec-out screencap -p > screenshots/codex-relay-dashboard.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: codex-relay-apk-screenshots
          path: screenshots/*.png
          if-no-files-found: error
