<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Codex Remote">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Codex Remote</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
    <link rel="stylesheet" href="/styles.css?v=5">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <nav class="brand" aria-label="Codex Remote">
          <img class="mark" src="/brand/codex-remote-logo.svg" alt="" aria-hidden="true">
          <span>
            <strong>Codex Remote</strong>
            <small id="workdir">Android control surface</small>
          </span>
        </nav>
        <div class="status" id="status" role="status">Locked</div>
      </header>

      <main class="workspace">
        <section class="access" id="accessPanel" aria-labelledby="accessTitle">
          <article class="unlock-panel">
            <div class="unlock-head">
              <img class="hero-logo" src="/brand/codex-remote-logo.svg" alt="Codex Remote logo">
              <div class="access-copy">
                <p class="eyebrow">Private app-server</p>
                <h1 id="accessTitle">Connect to Codex</h1>
                <p>Open a live terminal on this Mac.</p>
              </div>
            </div>

            <dl class="connection-summary" aria-label="Connection details">
              <div>
                <dt>Server</dt>
                <dd id="endpoint">localhost:8787</dd>
              </div>
              <div>
                <dt>Workspace</dt>
                <dd id="workspaceName">Loading</dd>
              </div>
            </dl>

            <form class="login" id="loginForm">
              <label for="token">Remote token</label>
              <div class="token-row">
                <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Paste token" required>
                <button class="primary" id="connectButton" type="submit">Unlock</button>
              </div>
              <p class="form-message" id="loginError" role="alert"></p>
            </form>
          </article>
        </section>

        <section class="remote hidden" id="remotePanel" aria-label="Codex terminal">
          <div class="terminal-wrap">
            <div class="terminal-head">
              <span id="sessionLabel">No session</span>
              <button class="icon-button" id="clearButton" type="button" aria-label="Clear terminal">⌫</button>
            </div>
            <div class="terminal skeleton" id="terminal" tabindex="0" aria-live="polite"></div>
          </div>

          <form class="composer" id="composer">
            <label for="prompt">Command</label>
            <div class="quick-keys" aria-label="Terminal shortcuts">
              <button class="key-button" type="button" data-key="escape">Esc</button>
              <button class="key-button" type="button" data-key="tab">Tab</button>
              <button class="key-button" type="button" data-key="up">↑</button>
              <button class="key-button" type="button" data-key="down">↓</button>
            </div>
            <textarea id="prompt" rows="3" placeholder="Ask Codex to edit, run, explain, or debug..."></textarea>
            <div class="actions">
              <button class="secondary" id="interruptButton" type="button">Ctrl+C</button>
              <button class="primary" type="submit">Send</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="/app.js?v=5" type="module"></script>
  </body>
</html>
